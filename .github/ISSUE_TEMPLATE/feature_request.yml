name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests that would make Tilqos keep, log or send more than [docs/PRIVACY.md](https://github.com/elapen/tilqos/blob/main/docs/PRIVACY.md) allows (cloud features, telemetry, syncing, remote dictionaries, logging of typed text) will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Detection / accuracy"
        - "Kazakh"
        - "Transliteration"
        - "Hints and interface"
        - "Per-app behaviour"
        - "Hotkeys"
        - "Windows"
        - "Documentation"
        - "Other"
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I am willing to try implementing this (pull requests are welcome)
